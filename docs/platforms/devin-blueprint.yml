# Devin environment blueprint for buwiz-forms: Linux, macOS and Windows.
#
# Paste this whole file into the repository's blueprint on any Devin account
# (Settings > Environment > the buwiz-forms repo > Blueprint) and save; Devin
# builds one snapshot per platform block. Each block reads everything it needs
# from this repository and the public hexuria/nsh repository, so no secrets are
# required. Delete the blocks for platforms you don't use.
#
#   Linux:   GPUI desktop app, NSH app (Ubuntu 24.04 sidecar), Android emulator
#   macOS:   GPUI desktop app, NSH app on macOS and the iOS Simulator
#   Windows: GPUI desktop app, NSH app on the Android emulator
#
# All platforms: `just mock-account` serves a mock Buwiz account server on
# 127.0.0.1:3008 for the app's Sign in (Android reaches it through
# `adb reverse tcp:3008 tcp:3008`). See docs/platforms/devin-environment.md.

# Linux (default platform): GPUI deps natively; NSH toolchain in a 24.04
# sidecar image because Ubuntu 22.04's GTK 4.6 is below the required 4.14.
# Android: SDK/NDK/emulator on the host, NSH Android builds in the sidecar.
initialize: |
  # --compositor: the VM's KWin runs without compositing; xcompmgr lets GPUI
  # keep its own frame (without it the app falls back to the KWin frame).
  bash scripts/setup-linux.sh --compositor
  # NSH CLI, Android SDK/NDK/emulator, the "buwiz" AVD, ~/BuwizNsh/nsh2404.sh.
  bash scripts/setup-linux-nsh.sh
  echo "ANDROID_HOME=$HOME/Android/Sdk" >> $ENVRC
  echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $ENVRC
maintenance: |
  # Re-pins ../nsh and rebuilds the nsh CLI and Android runtime only when
  # NSH_PINNED_REF changed.
  bash scripts/setup-linux-nsh.sh
knowledge:
  - name: startup
    contents: |
      pgrep xcompmgr || (DISPLAY=:0 xcompmgr &)   # GPUI keeps its own frame; without it the app uses the KWin frame
      GPUI app: DISPLAY=:0 VK_ICD_FILENAMES=/dev/null BUWIZ_NO_KEYCHAIN=1 EBIR_TEST_ENV=1 BIR_AUTH_BYPASS=1 BIR_SFTP_DRY_RUN=1 just run   # VK_ICD_FILENAMES avoids stale llvmpipe frames
      Account sign-in: just mock-account &   # mock Buwiz account server on 127.0.0.1:3008; start before the NSH app
      NSH app: ~/BuwizNsh/nsh2404.sh nsh run --target linux   # real window on :0
  - name: android
    contents: |
      DISPLAY=:0 ~/Android/Sdk/emulator/emulator -avd buwiz -no-snapshot-save -no-audio -gpu swiftshader_indirect &
      ~/Android/Sdk/platform-tools/adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
      just mock-account & ~/Android/Sdk/platform-tools/adb reverse tcp:3008 tcp:3008   # app's Sign in reaches the host account server
      ~/BuwizNsh/nsh2404.sh nsh run --target android   # first run builds 3 ABIs (~10 min)
  - name: test
    contents: |
      xvfb-run -a just test && ~/BuwizNsh/nsh2404.sh nsh check   # the sidecar has no just; nsh2404.sh runs from nsh/
---
# macOS: GPUI desktop app, NSH app on macOS and the iOS Simulator (no Android).
runs-on: macos
initialize: |
  # Homebrew rustup's proxies must win over pinned toolchain links, or the
  # NSH checkout's rust-toolchain.toml is ignored.
  export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
  brew install just
  bash scripts/setup-macos.sh
  rustup target add aarch64-apple-ios aarch64-apple-ios-sim
  [ -d ../nsh ] || git clone https://github.com/hexuria/nsh ../nsh
  (cd ../nsh && rustup target add aarch64-apple-ios aarch64-apple-ios-sim)
  grep -q opt/rustup/bin ~/.zprofile 2>/dev/null || echo 'export PATH="/opt/homebrew/opt/rustup/bin:$HOME/BuwizNsh/tools/bin:$PATH"' >> ~/.zprofile
maintenance: |
  export PATH="/opt/homebrew/opt/rustup/bin:$PATH" CARGO_INCREMENTAL=0
  # NSH at the commit CI pins; the nsh CLI must be built from the same checkout.
  ref=$(sed -n 's/^ *NSH_PINNED_REF: *//p' .github/workflows/nsh.yml)
  (cd ../nsh && git fetch origin "$ref" && git checkout --detach "$ref")
  ~/BuwizNsh/tools/bin/nsh --version 2>/dev/null | grep -q "(${ref:0:7})" || (cd ../nsh && cargo install --locked --path crates/nsh-cli --root ~/BuwizNsh/tools)
  # Free disk for the GPUI + NSH macOS/iOS-sim builds.
  rm -rf ~/Library/Developer/DVTDownloads; brew cleanup -s >/dev/null 2>&1 || true; rm -rf "$(brew --cache)"
knowledge:
  - name: startup
    contents: |
      GPUI desktop app: BUWIZ_NO_KEYCHAIN=1 EBIR_TEST_ENV=1 BIR_AUTH_BYPASS=1 BIR_SFTP_DRY_RUN=1 just run
      Account sign-in: just mock-account &   # mock Buwiz account server on 127.0.0.1:3008; start before the NSH app
      NSH app on macOS: just nsh-run
  - name: ios
    contents: |
      just mock-account & just mock-bir & just mock-relay &   # the Simulator shares the host's localhost
      cd nsh; PATH=~/BuwizNsh/tools/bin:$PATH CARGO_TARGET_DIR=~/BuwizNsh/target-nsh SIMCTL_CHILD_BIR_RELAY_URL=http://127.0.0.1:8787 SIMCTL_CHILD_EBIR_TEST_ENV=1 SIMCTL_CHILD_BUWIZ_NO_KEYCHAIN=1 SIMCTL_CHILD_BIR_AUTH_BYPASS=1 nsh run --target ios
  - name: test
    contents: |
      just nsh-check && just nsh-build && just nsh-test   # CARGO_INCREMENTAL=0 saves disk
---
# Windows: GPUI desktop app, Android SDK + emulator, NSH CLI.
runs-on: windows
shell: powershell
initialize:
  - name: desktop toolchain (VS Build Tools, Rust, OpenSSL, just, Perl, NASM)
    run: |
      powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-windows.ps1
      exit $LASTEXITCODE
  - name: Android SDK, NDK, emulator and AVD
    run: |
      $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
      powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-android-windows.ps1
      exit $LASTEXITCODE
  - name: NSH checkout at the pinned commit and the nsh CLI
    run: |
      $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
      $pin = ((Select-String -Path .github\workflows\nsh.yml -Pattern 'NSH_PINNED_REF:\s*(\S+)').Matches[0].Groups[1].Value)
      if (-not (Test-Path ..\nsh)) { git clone https://github.com/hexuria/nsh ..\nsh }
      git -C ..\nsh fetch origin $pin
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      git -C ..\nsh checkout --detach $pin
      $env:RUSTUP_TOOLCHAIN = '1.99.0'; $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'; $env:RUST_MIN_STACK = '268435456'
      cargo install --locked --path ..\nsh\crates\nsh-cli --root "$HOME\BuwizNsh\tools"
      exit $LASTEXITCODE
maintenance:
  - name: NSH checkout and nsh CLI at a new pin
    run: |
      $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
      $pin = ((Select-String -Path .github\workflows\nsh.yml -Pattern 'NSH_PINNED_REF:\s*(\S+)').Matches[0].Groups[1].Value)
      git -C ..\nsh fetch origin $pin
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      git -C ..\nsh checkout --detach $pin
      $have = & "$HOME\BuwizNsh\tools\bin\nsh.exe" --version 2>$null
      if ("$have" -notlike "*($($pin.Substring(0,7)))*") {
        $env:RUSTUP_TOOLCHAIN = '1.99.0'; $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'; $env:RUST_MIN_STACK = '268435456'
        cargo install --locked --path ..\nsh\crates\nsh-cli --root "$HOME\BuwizNsh\tools"
        exit $LASTEXITCODE
      }
knowledge:
  - name: startup
    contents: |
      GPUI app: $env:BUWIZ_NO_KEYCHAIN=1; $env:EBIR_TEST_ENV=1; $env:BIR_AUTH_BYPASS=1; $env:BIR_SFTP_DRY_RUN=1; just run
      Account sign-in: Start-Process just mock-account   # mock Buwiz account server on 127.0.0.1:3008; start before the app
  - name: android
    contents: |
      Emulator (cold boot is the reliable one, ~8 min): Start-Process emulator '-avd buwiz_api35 -accel on -feature WindowsHypervisorPlatform -gpu swiftshader_indirect -cores 4 -memory 4096 -no-snapshot -no-boot-anim'; adb wait-for-device
      adb reverse tcp:3008 tcp:3008; adb reverse tcp:8787 tcp:8787   # account mock and relay on the host
      Build and install the app: docs/platforms/devin-environment.md, "Windows (Android)".
  - name: test
    contents: |
      cargo test -p bir-core ; $env:Path = "$HOME\BuwizNsh\tools\bin;$env:Path" ; cd nsh ; nsh check -v ; nsh build
